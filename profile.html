<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>현다예 소개</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    padding: 40px 16px;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    max-width: 480px;
    width: 100%;
    padding: 40px 32px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    text-align: center;
  }
  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
  }
  h1 {
    margin: 0 0 4px;
    color: #333;
    font-size: 28px;
  }
  .job {
    color: #e0785a;
    font-weight: 600;
    margin-bottom: 24px;
    font-size: 15px;
    letter-spacing: 0.5px;
  }
  .section-title {
    font-size: 16px;
    font-weight: 700;
    color: #333;
    margin: 28px 0 14px;
    text-align: left;
  }
  .likes {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .likes li {
    background: #fff5ef;
    border-radius: 12px;
    padding: 14px 16px;
    text-align: left;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    color: #444;
  }
  .emoji {
    font-size: 22px;
  }
  .footer {
    margin-top: 28px;
    font-size: 13px;
    color: #aaa;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">✍️</div>
    <h1>현다예</h1>
    <div class="job">Blogger</div>

    <div class="section-title">좋아하는 것</div>
    <ul class="likes">
      <li><span class="emoji">📚</span> 책 읽기</li>
      <li><span class="emoji">☕</span> 카페에서 글쓰기</li>
      <li><span class="emoji">🌸</span> 여행하며 사진 찍기</li>
    </ul>

    <div class="footer">Welcome to my page</div>
  </div>
</body>
</html>
